<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon profil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">Plateforme de vote</span>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm">Déconnexion</button>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center mt-4">
      <div class="col-md-6">

        <div id="message"></div>

        <div class="card shadow mb-4">
          <div class="card-body">
            <h4 class="mb-3">Mon profil</h4>
            <p class="mb-1"><strong>Nom d'utilisateur :</strong> <span id="infoUsername"></span></p>
            <p class="mb-1"><strong>Email :</strong> <span id="infoEmail"></span></p>
            <p class="mb-1"><strong>Rôle :</strong> <span id="infoRole" class="badge bg-secondary"></span></p>
            <p class="mb-0"><strong>Inscrit le :</strong> <span id="infoDate"></span></p>
          </div>
        </div>

        <div class="card shadow mb-4">
          <div class="card-body">
            <h5 class="mb-3">Modifier le nom d'utilisateur</h5>
            <form id="usernameForm">
              <div class="mb-3">
                <input type="text" class="form-control" id="newUsername" placeholder="Nouveau nom d'utilisateur" required>
              </div>
              <button type="submit" class="btn btn-primary">Enregistrer</button>
            </form>
          </div>
        </div>

        <div class="card shadow">
          <div class="card-body">
            <h5 class="mb-3">Modifier le mot de passe</h5>
            <form id="passwordForm">
              <div class="mb-3">
                <input type="password" class="form-control" id="currentPassword" placeholder="Mot de passe actuel" required>
              </div>
              <div class="mb-3">
                <input type="password" class="form-control" id="newPassword" placeholder="Nouveau mot de passe" required minlength="6">
              </div>
              <button type="submit" class="btn btn-primary">Changer le mot de passe</button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="/js/auth-client.js"></script>
</body>
</html>
